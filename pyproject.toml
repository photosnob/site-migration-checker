[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "migcheck"
version = "0.1.0"
description = "Check redirects, indexability, and content parity before an SEO site migration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Shum" }]
keywords = ["seo", "migration", "redirects", "sitemap", "robots"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["mypy>=1.13", "pytest>=8", "ruff>=0.8"]

[project.scripts]
migcheck = "migcheck.cli:main"

[project.urls]
Homepage = "https://github.com/photosnob/site-migration-checker"
Repository = "https://github.com/photosnob/site-migration-checker"
Issues = "https://github.com/photosnob/site-migration-checker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/migcheck"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["migcheck"]
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
